version: '3.8'

services:
  phonemail:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phonemail-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/phonemail.sqlite
    env_file:
      - .env
    volumes:
      # Persistent host volume mount for SQLite database
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
